<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario & Caja Pro</title>
    <style>
        :root {
            --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b;
            --accent: #007aff; --success: #34c759; --danger: #ff3b30; --border: #e5e5ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

        /* Login Screen */
        #loginScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; background: var(--bg-color); }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        .login-box h2 { margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; outline: none; }
        .login-box button { width: 100%; background: var(--text-main); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #loginError { color: var(--danger); font-size: 14px; margin-top: 10px; display: none; }

        /* Main App Header */
        header { background-color: var(--card-bg); padding: 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-top h1 { font-size: 20px; font-weight: 700; }
        .btn-logout { background: #ffebee; color: var(--danger); border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .dash-card { background: var(--bg-color); padding: 10px 5px; border-radius: 12px; text-align: center; }
        .dash-card span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; text-transform: uppercase;}
        .dash-card strong { font-size: 15px; font-weight: 700; }
        .dash-full { grid-column: span 3; background: #e5f4eb; color: var(--success); padding: 15px; border-radius: 12px; text-align: center; }
        .dash-full span { font-size: 12px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 5px; color: #248a3d; }
        .dash-full strong { font-size: 24px; font-weight: 800; }

        /* Contenedores y Tarjetas */
        #mainApp { display: none; }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .flex-row { display: flex; gap: 15px; }
        .img-box { width: 70px; height: 70px; border-radius: 10px; display:flex; justify-content:center; align-items:center; font-size: 30px; background: var(--bg-color); border: 1px solid var(--border);}
        .info-box { flex: 1; }
        .title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .financials { display: flex; justify-content: space-between; font-size: 12px; background: var(--bg-color); padding: 8px; border-radius: 8px; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        
        .btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; border: none; cursor: pointer; }
        .btn-green { background: var(--success); color: white; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-red { background: #ffebee; color: var(--danger); flex: 0.3; }

        .stock-control { display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); border-radius: 10px; padding: 5px; width: 100px; }
        .stock-btn { background: white; border: 1px solid var(--border); width: 25px; height: 25px; border-radius: 6px; font-weight: bold; cursor: pointer;}
        .stock-num { font-size: 14px; font-weight: bold; }

        /* Wallet */
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .wallet-card { background: var(--card-bg); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); }
        .w-icon { font-size: 24px; margin-bottom: 5px; }
        .w-title { font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .w-amount { font-size: 18px; font-weight: 800; margin-top: 5px;}
        .rate-card { grid-column: span 2; background: #fff5e6; border-color: #ffd8a8; flex-direction: row; justify-content: space-between; padding: 15px 20px; cursor: pointer;}

        /* Bottom Nav & FAB */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; z-index: 20; }
        .nav-item { flex: 1; text-align: center; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }
        .fab { position: fixed; bottom: 80px; right: 20px; width: 55px; height: 55px; background: var(--text-main); color: white; border-radius: 30px; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 15; border: none; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 30; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--card-bg); width: 100%; border-radius: 20px 20px 0 0; padding: 25px 20px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; background-color: var(--bg-color); outline: none; }
        .btn-submit { width: 100%; background: var(--text-main); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer; }
        .btn-cancel { width: 100%; background: transparent; color: var(--text-muted); border: none; padding: 12px; margin-top: 5px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .hidden { display: none !important; }
        
        /* Loading Overlay */
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 999; justify-content: center; align-items: center; font-weight: bold; font-size: 18px;}
    </style>
</head>
<body>

    <!-- Pantalla de Inicio de Sesión -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>🔐 Mi Negocio</h2>
            <input type="email" id="emailInput" placeholder="Correo electrónico">
            <input type="password" id="passwordInput" placeholder="Contraseña">
            <button onclick="login()">Entrar al Sistema</button>
            <p id="loginError"></p>
        </div>
    </div>

    <!-- Indicador de Carga -->
    <div id="loadingOverlay">Sincronizando con la nube... ☁️</div>

    <!-- App Principal -->
    <div id="mainApp">
        <header>
            <div class="header-top">
                <h1 id="headerTitle">Inventario</h1>
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>
            <div class="dashboard" id="dashGrid"></div>
        </header>

        <div class="container active" id="view-phones"><div id="phonesList"></div></div>
        <div class="container" id="view-acc"><div id="accList"></div></div>
        <div class="container" id="view-wallet">
            <div class="wallet-grid">
                <div class="wallet-card rate-card" onclick="updateRate()">
                    <div style="display:flex; align-items:center; gap:8px;"><span class="w-icon">💱</span><span class="w-title" style="color:#d97706;">Tasa COP/USD</span></div>
                    <div class="w-amount" style="color:#d97706;" id="uiRate">4000</div>
                </div>
                <div class="wallet-card"><span class="w-icon">💵</span><span class="w-title">Efectivo USD</span><span class="w-amount" id="uiUsd">$0</span></div>
                <div class="wallet-card"><span class="w-icon">🇨🇴</span><span class="w-title">Efectivo COP</span><span class="w-amount" id="uiCop">$0</span></div>
                <div class="wallet-card"><span class="w-icon">🪙</span><span class="w-title">USDT (Binance)</span><span class="w-amount" id="uiUsdt">$0</span></div>
                <div class="wallet-card"><span class="w-icon">💳</span><span class="w-title">Zinli</span><span class="w-amount" id="uiZinli">$0</span></div>
            </div>
        </div>
        <div class="container" id="view-history">
            <button class="btn btn-green" style="width:100%; margin-bottom:15px;" onclick="exportToCSV()">📊 Descargar Reporte (Excel)</button>
            <div id="historyList"></div>
        </div>

        <button class="fab" id="fabBtn" onclick="handleFab()">+</button>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('phones')"><span class="nav-icon">📱</span>Equipos</div>
            <div class="nav-item" onclick="switchTab('acc')"><span class="nav-icon">🔌</span>Accesorios</div>
            <div class="nav-item" onclick="switchTab('wallet')"><span class="nav-icon">💸</span>Caja</div>
            <div class="nav-item" onclick="switchTab('history')"><span class="nav-icon">💰</span>Ventas</div>
        </div>
    </div>

    <!-- Modals (Iguales que la versión anterior) -->
    <div class="modal" id="modalPhone"><div class="modal-content"><h2>📱 Nuevo Equipo</h2><form id="formPhone"><div class="form-group"><label>Modelo y Capacidad</label><input type="text" id="pModel" required></div><div class="form-group"><label>Batería (%)</label><input type="number" id="pBat" required></div><div class="form-group"><label>Costo ($)</label><input type="number" step="0.01" id="pCost" required></div><div class="form-group"><label>Precio Venta ($)</label><input type="number" step="0.01" id="pPrice" required></div><button type="submit" class="btn-submit">Guardar</button><button type="button" class="btn-cancel" onclick="closeModals()">Cancelar</button></form></div></div>
    <div class="modal" id="modalAcc"><div class="modal-content"><h2>🔌 Nuevo Accesorio</h2><form id="formAcc"><div class="form-group"><label>Nombre</label><input type="text" id="aName" required></div><div class="form-group"><label>Stock Inicial</label><input type="number" id="aQty" required></div><div class="form-group"><label>Costo Unitario ($)</label><input type="number" step="0.01" id="aCost" required></div><div class="form-group"><label>Precio Venta Unitario ($)</label><input type="number" step="0.01" id="aPrice" required></div><button type="submit" class="btn-submit">Guardar</button><button type="button" class="btn-cancel" onclick="closeModals()">Cancelar</button></form></div></div>
    <div class="modal" id="modalWallet"><div class="modal-content"><h2>💸 Mover Dinero</h2><form id="formWallet"><div class="form-group"><label>Tipo de Movimiento</label><select id="wType" onchange="toggleTransferFields()"><option value="add">Ingreso (Sumar)</option><option value="sub">Egreso (Restar / Gastos)</option><option value="transfer">🔄 Transferencia / Cambio</option></select></div><div id="normalFields"><div class="form-group"><label>Cuenta</label><select id="wAccount"><option value="usd">Efectivo USD</option><option value="cop">Efectivo COP</option><option value="usdt">USDT</option><option value="zinli">Zinli</option></select></div><div class="form-group"><label>Monto</label><input type="number" step="0.01" id="wAmount"></div></div><div id="transferFields" class="hidden"><div class="form-group" style="background: #ffebee; padding: 10px; border-radius: 8px;"><label style="color: var(--danger);">📤 Sale De:</label><select id="tFromAcc"><option value="usdt">USDT</option><option value="zinli">Zinli</option><option value="usd">Efectivo USD</option><option value="cop">Efectivo COP</option></select><label style="margin-top:8px;">Monto que Sale:</label><input type="number" step="0.01" id="tAmountOut"></div><div style="text-align:center; font-size:24px; margin: 10px 0;">⬇️</div><div class="form-group" style="background: #e5f4eb; padding: 10px; border-radius: 8px;"><label style="color: var(--success);">📥 Entra A:</label><select id="tToAcc"><option value="zinli">Zinli</option><option value="usdt">USDT</option><option value="usd">Efectivo USD</option><option value="cop">Efectivo COP</option></select><label style="margin-top:8px;">Monto Real que Entró:</label><input type="number" step="0.01" id="tAmountIn"></div></div><button type="submit" class="btn-submit">Registrar Movimiento</button><button type="button" class="btn-cancel" onclick="closeModals()">Cancelar</button></form></div></div>

    <!-- Scripts de Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_t1uM7Pflwp10YdQ5lZY4O4kHpyOzoxk",
            authDomain: "app-inventario-36014.firebaseapp.com",
            projectId: "app-inventario-36014",
            storageBucket: "app-inventario-36014.firebasestorage.app",
            messagingSenderId: "705898134060",
            appId: "1:705898134060:web:47ad5efe885c24dc33af89"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables Globales
        window.dbPhones = [];
        window.dbAcc = [];
        window.dbHist = [];
        window.dbWallet = { usd: 0, cop: 0, usdt: 0, zinli: 0, rate: 4000 };
        window.currentUserUID = null;
        window.currentTab = 'phones';

        // Autenticación
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUserUID = user.uid;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                await loadDataFromCloud();
            } else {
                window.currentUserUID = null;
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'flex';
            }
        });

        window.login = () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            signInWithEmailAndPassword(auth, email, pass).catch((error) => {
                err.innerText = "Error: Verifica tu correo o contraseña.";
                err.style.display = 'block';
            });
        };

        window.logout = () => signOut(auth);

        // Sincronización con Firestore
        async function loadDataFromCloud() {
            showLoading(true);
            try {
                const docRef = doc(db, "business_data", window.currentUserUID);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.dbPhones = data.phones || [];
                    window.dbAcc = data.acc || [];
                    window.dbHist = data.hist || [];
                    window.dbWallet = data.wallet || { usd: 0, cop: 0, usdt: 0, zinli: 0, rate: 4000 };
                }
                renderUI();
            } catch (e) {
                console.error("Error cargando datos", e);
                alert("Error cargando datos de la nube.");
            }
            showLoading(false);
        }

        window.saveAll = async () => {
            if (!window.currentUserUID) return;
            showLoading(true);
            try {
                const docRef = doc(db, "business_data", window.currentUserUID);
                await setDoc(docRef, {
                    phones: window.dbPhones,
                    acc: window.dbAcc,
                    hist: window.dbHist,
                    wallet: window.dbWallet
                });
                renderUI();
            } catch (e) {
                console.error("Error guardando", e);
                alert("Error guardando en la nube.");
            }
            showLoading(false);
        }

        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }

        // Utilidades UI
        const fMoney = (n, c = '$') => c + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const fDate = (d) => new Date(d).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });

        window.switchTab = (tab) => {
            window.currentTab = tab;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            const fab = document.getElementById('fabBtn');
            fab.style.display = tab === 'history' ? 'none' : 'flex';
            if(tab==='phones') fab.innerHTML = '📱+';
            if(tab==='acc') fab.innerHTML = '🔌+';
            if(tab==='wallet') fab.innerHTML = '💸±';
            renderUI();
        }

        window.handleFab = () => {
            if(currentTab === 'phones') document.getElementById('modalPhone').style.display = 'flex';
            if(currentTab === 'acc') document.getElementById('modalAcc').style.display = 'flex';
            if(currentTab === 'wallet') {
                document.getElementById('modalWallet').style.display = 'flex';
                document.getElementById('wType').value = 'add';
                toggleTransferFields();
            }
        }
        window.closeModals = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');

        window.toggleTransferFields = () => {
            const type = document.getElementById('wType').value;
            const norm = document.getElementById('normalFields');
            const trans = document.getElementById('transferFields');
            if(type === 'transfer') {
                norm.classList.add('hidden'); trans.classList.remove('hidden');
                document.getElementById('wAmount').removeAttribute('required');
                document.getElementById('tAmountOut').setAttribute('required', 'true');
                document.getElementById('tAmountIn').setAttribute('required', 'true');
            } else {
                norm.classList.remove('hidden'); trans.classList.add('hidden');
                document.getElementById('wAmount').setAttribute('required', 'true');
                document.getElementById('tAmountOut').removeAttribute('required');
                document.getElementById('tAmountIn').removeAttribute('required');
            }
        }

        window.renderUI = () => {
            const dash = document.getElementById('dashGrid');
            let tTitle = "";

            if(currentTab === 'phones') {
                tTitle = "Inventario Equipos";
                let cost=0, price=0, profit=0, html='';
                window.dbPhones.forEach(i => {
                    cost+=i.cost; price+=i.price; profit+=(i.price-i.cost);
                    html+=`<div class="card"><div class="flex-row"><div class="img-box">📱</div><div class="info-box"><div class="title">${i.model}</div><div class="subtitle">Batería: ${i.bat}%</div><div class="financials"><div>Costo:<br><strong>${fMoney(i.cost)}</strong></div><div style="color:var(--success);">Venta:<br><strong>${fMoney(i.price)}</strong></div></div></div></div><div class="actions"><button class="btn btn-green" onclick="sellPhone(${i.id})">💰 Vender</button><button class="btn btn-red" onclick="delPhone(${i.id})">🗑️</button></div></div>`;
                });
                document.getElementById('phonesList').innerHTML = html;
                dash.innerHTML = `<div class="dash-card"><span>Inversión</span><strong>${fMoney(cost)}</strong></div><div class="dash-card"><span>Venta Proy.</span><strong>${fMoney(price)}</strong></div><div class="dash-card"><span>Ganancia</span><strong style="color:var(--success)">+${fMoney(profit)}</strong></div>`;
            }
            else if(currentTab === 'acc') {
                tTitle = "Accesorios";
                let inv=0, stock=0, html='';
                window.dbAcc.forEach(i => {
                    inv+=(i.cost*i.qty); stock+=i.qty;
                    html+=`<div class="card"><div class="flex-row"><div class="info-box"><div class="title">${i.name}</div><div class="subtitle">Costo: ${fMoney(i.cost)} | Venta: ${fMoney(i.price)}</div><div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;"><div class="stock-control"><button class="stock-btn" onclick="modStock(${i.id}, -1)">-</button><span class="stock-num">${i.qty}</span><button class="stock-btn" onclick="modStock(${i.id}, 1)">+</button></div><button class="btn btn-blue" style="padding:8px 15px; flex:none;" onclick="sellAcc(${i.id})">Vender 1</button></div></div></div></div>`;
                });
                document.getElementById('accList').innerHTML = html;
                dash.innerHTML = `<div class="dash-full"><span>Valor Inventario</span><strong>${fMoney(inv)}</strong></div>`;
            }
            else if(currentTab === 'wallet') {
                tTitle = "Caja y Tesorería";
                let eqCopUsd = window.dbWallet.cop / window.dbWallet.rate;
                let totalCapital = window.dbWallet.usd + window.dbWallet.usdt + window.dbWallet.zinli + eqCopUsd;
                document.getElementById('uiUsd').innerText = fMoney(window.dbWallet.usd);
                document.getElementById('uiCop').innerText = fMoney(window.dbWallet.cop, '$ ');
                document.getElementById('uiUsdt').innerText = fMoney(window.dbWallet.usdt);
                document.getElementById('uiZinli').innerText = fMoney(window.dbWallet.zinli);
                document.getElementById('uiRate').innerText = fMoney(window.dbWallet.rate, '$ ');
                dash.innerHTML = `<div class="dash-full" style="background:#eef2ff;"><span>Capital Total Disponible (USD)</span><strong style="color:var(--accent)">${fMoney(totalCapital)}</strong></div>`;
            }
            else if(currentTab === 'history') {
                tTitle = "Historial de Ventas";
                let rev=0, prof=0, html='';
                window.dbHist.forEach(i => {
                    let g = i.sellPrice - i.cost; rev += i.sellPrice; prof += g;
                    let icon = i.type === 'phone' ? '📱' : '🔌';
                    html += `<div class="card" style="opacity:0.9;"><div class="flex-row"><div class="info-box"><div class="title">${icon} ${i.name}</div><div class="subtitle">Vendido el: ${fDate(i.date)}</div><div class="financials"><div>Ingreso: <strong>${fMoney(i.sellPrice)}</strong></div><div style="color:var(--accent)">Ganancia: <strong>+${fMoney(g)}</strong></div></div></div></div></div>`;
                });
                document.getElementById('historyList').innerHTML = html;
                dash.innerHTML = `<div class="dash-card" style="grid-column: span 1.5;"><span>Ingresos Tot.</span><strong>${fMoney(rev)}</strong></div><div class="dash-card" style="grid-column: span 1.5;"><span>Ganancia Real</span><strong style="color:var(--accent)">+${fMoney(prof)}</strong></div>`;
            }
            document.getElementById('headerTitle').innerText = tTitle;
        }

        // Eventos de Formularios
        document.getElementById('formPhone').onsubmit = (e) => {
            e.preventDefault();
            window.dbPhones.push({ id: Date.now(), model: document.getElementById('pModel').value, bat: document.getElementById('pBat').value, cost: parseFloat(document.getElementById('pCost').value), price: parseFloat(document.getElementById('pPrice').value), date: new Date().toISOString() });
            window.saveAll(); closeModals(); e.target.reset();
        };

        document.getElementById('formAcc').onsubmit = (e) => {
            e.preventDefault();
            window.dbAcc.push({ id: Date.now(), name: document.getElementById('aName').value, qty: parseInt(document.getElementById('aQty').value), cost: parseFloat(document.getElementById('aCost').value), price: parseFloat(document.getElementById('aPrice').value) });
            window.saveAll(); closeModals(); e.target.reset();
        };

        document.getElementById('formWallet').onsubmit = (e) => {
            e.preventDefault();
            const type = document.getElementById('wType').value;
            if(type === 'transfer') {
                let fromAcc = document.getElementById('tFromAcc').value;
                let toAcc = document.getElementById('tToAcc').value;
                let amountOut = parseFloat(document.getElementById('tAmountOut').value);
                let amountIn = parseFloat(document.getElementById('tAmountIn').value);
                if(window.dbWallet[fromAcc] >= amountOut) {
                    window.dbWallet[fromAcc] -= amountOut;
                    window.dbWallet[toAcc] += amountIn;
                } else { alert(`Saldo insuficiente en ${fromAcc.toUpperCase()}`); return; }
            } else {
                let acc = document.getElementById('wAccount').value;
                let amt = parseFloat(document.getElementById('wAmount').value);
                if(type === 'add') window.dbWallet[acc] += amt; else window.dbWallet[acc] -= amt;
            }
            window.saveAll(); closeModals(); e.target.reset();
        };

        // Funciones Globales para Botones HTML
        window.updateRate = () => { let r = prompt("Nueva tasa COP a USD:", window.dbWallet.rate); if(r && !isNaN(r)) { window.dbWallet.rate = parseFloat(r); window.saveAll(); } }
        window.sellPhone = (id) => {
            let idx = window.dbPhones.findIndex(i => i.id === id); let p = window.dbPhones[idx];
            let price = prompt(`¿Precio final de venta del ${p.model}?`, p.price);
            if(price) {
                window.dbHist.push({ id: Date.now(), type: 'phone', name: p.model, cost: p.cost, sellPrice: parseFloat(price), date: new Date().toISOString() });
                window.dbPhones.splice(idx, 1);
                let dest = prompt("¿Dónde recibiste el pago?\n1. USD\n2. COP\n3. USDT\n4. Zinli", "1");
                let val = parseFloat(price);
                if(dest==="1") window.dbWallet.usd += val; if(dest==="2") window.dbWallet.cop += (val * window.dbWallet.rate); if(dest==="3") window.dbWallet.usdt += val; if(dest==="4") window.dbWallet.zinli += val;
                window.saveAll();
            }
        }
        window.sellAcc = (id) => {
            let idx = window.dbAcc.findIndex(i => i.id === id); let a = window.dbAcc[idx];
            if(a.qty > 0) {
                window.dbHist.push({ id: Date.now(), type: 'acc', name: a.name, cost: a.cost, sellPrice: a.price, date: new Date().toISOString() });
                a.qty -= 1;
                let dest = prompt(`¿A dónde entró el dinero?\n1. USD\n2. COP\n3. USDT\n4. Zinli`, "1");
                let val = parseFloat(a.price);
                if(dest==="1") window.dbWallet.usd += val; if(dest==="2") window.dbWallet.cop += (val * window.dbWallet.rate); if(dest==="3") window.dbWallet.usdt += val; if(dest==="4") window.dbWallet.zinli += val;
                window.saveAll();
            }
        }
        window.modStock = (id, val) => { let i = window.dbAcc.find(i => i.id === id); if(i.qty + val >= 0) i.qty += val; window.saveAll(); }
        window.delPhone = (id) => { if(confirm("¿Eliminar equipo sin vender?")) { window.dbPhones = window.dbPhones.filter(i => i.id !== id); window.saveAll(); } }
        window.exportToCSV = () => {
            let csv = "data:text/csv;charset=utf-8,Tipo,Articulo,Costo ($),Venta ($),Ganancia ($),Fecha\n";
            window.dbHist.forEach(i => { let g = i.sellPrice - i.cost; csv += `"${i.type==="phone"?"Equipo":"Accesorio"}","${i.name}","${i.cost}","${i.sellPrice}","${g}","${fDate(i.date)}"\n`; });
            let link = document.createElement("a"); link.href = encodeURI(csv); link.download = `Ventas.csv`; link.click();
        }
    </script>
</body>
</html>
