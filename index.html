<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.json">
<title>Mi Negocio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFB; --elevated:#FFFFFF;
  --text:#1D1D1F; --muted:#86868B; --faint:#A1A1A6;
  --border:#E5E5EA; --border-2:#D2D2D7;
  --accent:#0071E3; --accent-text:#FFFFFF;
  --green:#34C759; --green-bg:#E8F8EC;
  --red:#FF3B30;   --red-bg:#FFECEB;
  --amber:#FF9500; --amber-bg:#FFF4E5;
  --ring:rgba(0,113,227,.15);
  --shadow-sm:0 1px 2px rgba(16,24,40,.04);
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
}
[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --elevated:#1C1C1E;
  --text:#F5F5F7; --muted:#98989D; --faint:#636366;
  --border:#2C2C2E; --border-2:#3A3A3C;
  --accent:#0A84FF; --accent-text:#FFFFFF;
  --green:#30D158; --green-bg:rgba(48,209,88,.14);
  --red:#FF453A;   --red-bg:rgba(255,69,58,.14);
  --amber:#FF9F0A; --amber-bg:rgba(255,159,10,.14);
  --ring:rgba(10,132,255,.25);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 3px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
  transition:background .25s, color .25s;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}

/* ============ LOGIN ============ */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;background:var(--bg);
}
.login-box{
  width:100%;max-width:380px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:32px 26px;
  box-shadow:var(--shadow);
}
.login-logo{
  width:56px;height:56px;border-radius:16px;margin:0 auto 18px;
  background:var(--accent);color:var(--accent-text);
  display:grid;place-items:center;
}
.login-box h1{
  font-size:22px;font-weight:600;text-align:center;letter-spacing:-.03em;
  margin-bottom:6px;
}
.login-box p.sub{
  font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px;
}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:11.5px;font-weight:600;color:var(--muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;
}
.input{
  width:100%;height:44px;padding:0 14px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:15px;
  transition:border-color .15s, box-shadow .15s;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.input::placeholder{color:var(--faint)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  transition:opacity .15s, transform .1s, background .15s, border-color .15s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.primary:hover{opacity:.88}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg)}
.btn.block{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}

.login-foot{
  text-align:center;margin-top:16px;font-size:13px;
}
.link{color:var(--accent);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}
.error{
  color:var(--red);font-size:12.5px;text-align:center;
  margin-top:12px;padding:10px;background:var(--red-bg);border-radius:8px;
  display:none;
}
.error.show{display:block}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 18px 12px;
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-text);
  display:grid;place-items:center;flex:0 0 auto;
}
.brand-info{min-width:0}
.brand-info h1{font-size:15px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-info span{font-size:11px;color:var(--muted)}
.iconbtn{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--muted);border:1px solid transparent;
  transition:.15s;
}
.iconbtn:hover{background:var(--surface);color:var(--text);border-color:var(--border)}

.search-wrap{
  position:relative;
  display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);height:38px;
  padding:0 12px;gap:8px;color:var(--faint);
}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.search-wrap input{
  flex:1;min-width:0;border:0;background:none;height:100%;
  font-size:14px;color:var(--text);
}
.search-wrap input::placeholder{color:var(--faint)}

/* ============ DASH ============ */
.dash{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-top:12px;
}
.dash-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  transition:border-color .15s;
}
.dash-card:hover{border-color:var(--border-2)}
.dash-card .lbl{
  font-size:10px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
  display:flex;align-items:center;gap:4px;
}
.dash-card .val{
  font-size:16px;font-weight:700;letter-spacing:-.02em;
  margin-top:4px;font-variant-numeric:tabular-nums;
}
.dash-card.wide{grid-column:span 3}
.val.pos{color:var(--green)}
.val.neg{color:var(--red)}
.val.acc{color:var(--accent)}

/* ============ MAIN ============ */
main{padding:18px; max-width:760px; margin:0 auto}
.view{display:none; animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ CARDS ============ */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  transition:border-color .15s;
}
.card:hover{border-color:var(--border-2)}
.card.warn{border-left:3px solid var(--red)}

.row{display:flex;gap:12px;align-items:flex-start}
.thumb{
  width:44px;height:44px;flex:0 0 auto;
  border-radius:12px;background:var(--surface-2);
  border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);
}
.info{flex:1;min-width:0}
.title{
  font-size:14.5px;font-weight:600;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sub{
  font-size:12px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta-row{
  display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;
}
.meta-row span{
  display:flex;flex-direction:column;font-size:11px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;
}
.meta-row span b{font-size:12.5px;color:var(--text);font-weight:600;text-transform:none;letter-spacing:0;margin-top:1px}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:20px;
  background:var(--green-bg);color:var(--green);
  white-space:nowrap;
}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.neutral{background:var(--surface-2);color:var(--muted)}

.actions{
  display:flex;gap:6px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border);
}
.actions .btn{flex:1;height:36px;font-size:13px}

/* Stock control */
.stock{display:flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
.stock button{
  width:26px;height:26px;border-radius:6px;color:var(--muted);
  display:grid;place-items:center;transition:.15s;
}
.stock button:hover{background:var(--surface);color:var(--text)}
.stock b{min-width:32px;text-align:center;font-size:13px;font-weight:600}

/* ============ WALLET ============ */
.wallet-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;
}
.wallet-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  position:relative;overflow:hidden;
}
.wallet-card .cur{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
}
.wallet-card .amt{
  font-size:20px;font-weight:700;letter-spacing:-.03em;
  margin-top:6px;font-variant-numeric:tabular-nums;
}
.wallet-card.total{grid-column:span 2;background:var(--surface-2)}
.wallet-card.total .amt{font-size:26px;color:var(--accent)}
.wallet-card.rate{cursor:pointer}
.wallet-card.rate:hover{border-color:var(--accent)}

/* ============ HISTORY ITEM ============ */
.h-item{
  display:flex;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.h-item:last-child{border-bottom:none}
.h-item .left{flex:1;min-width:0}
.h-item .l1{font-size:13.5px;font-weight:600;margin-bottom:2px}
.h-item .l2{font-size:11.5px;color:var(--muted)}
.h-item .right{text-align:right;font-variant-numeric:tabular-nums}
.h-item .amt{font-size:13.5px;font-weight:600}
.h-item .prof{font-size:11px;color:var(--green);font-weight:600;margin-top:2px}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;
  color:var(--faint);font-size:10px;font-weight:600;
  transition:color .15s, background .15s;
}
.nav-item.active{color:var(--accent)}
.nav-item:hover{color:var(--text)}
.nav-item.active:hover{color:var(--accent)}
.nav-item svg{transition:transform .15s}
.nav-item.active svg{transform:translateY(-1px)}

/* ============ FAB ============ */
.fab{
  position:fixed;right:20px;
  bottom:calc(82px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:16px;
  background:var(--accent);color:var(--accent-text);
  box-shadow:0 8px 24px rgba(0,113,227,.35);
  display:grid;place-items:center;z-index:35;
  transition:transform .15s, box-shadow .15s;
}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,113,227,.45)}
.fab:active{transform:scale(.95)}
.fab.hide{display:none}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:fade .2s ease;
}
.modal.show{display:flex}
.modal-content{
  width:100%;max-width:520px;
  background:var(--surface);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;
  animation:sheet .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--border-2);margin:6px auto 14px;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.modal-head h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.modal-foot{display:flex;gap:8px;margin-top:18px}
.modal-foot .btn{flex:1}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}

/* ============ CONFIRM ============ */
.confirm-box{
  text-align:center;padding:8px 0;
}
.confirm-ic{
  width:52px;height:52px;border-radius:50%;
  background:var(--red-bg);color:var(--red);
  display:grid;place-items:center;margin:0 auto 14px;
}
.confirm-box h3{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.confirm-box p{font-size:13px;color:var(--muted);line-height:1.5}

/* ============ TOAST / UNDO ============ */
.toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:200;display:flex;flex-direction:column-reverse;gap:8px;
  width:max-content;max-width:calc(100vw - 24px);
  pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px 10px 16px;
  background:var(--text);color:var(--bg);
  border-radius:12px;font-size:13px;font-weight:500;
  box-shadow:0 10px 34px rgba(0,0,0,.25);
  opacity:0;transform:translateY(12px) scale(.96);
  transition:.25s cubic-bezier(.2,.8,.3,1);
  pointer-events:auto;max-width:100%;
}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .undo{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:8px;
  background:rgba(255,255,255,.14);
  font-size:12.5px;font-weight:600;
  color:inherit;transition:background .15s;
}
.toast .undo:hover{background:rgba(255,255,255,.24)}

/* ============ SETTINGS ============ */
.setting-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.setting-item:last-child{border-bottom:none}
.setting-icon{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);
  flex:0 0 auto;
}
.setting-info{flex:1;min-width:0}
.setting-info .st{font-size:14px;font-weight:500;letter-spacing:-.01em}
.setting-info .ss{font-size:12px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{
  width:44px;height:26px;border-radius:20px;
  background:var(--border-2);position:relative;
  transition:background .2s;flex:0 0 auto;
}
.switch.on{background:var(--accent)}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch.on::after{transform:translateX(18px)}

/* ============ MISC ============ */
.empty{
  text-align:center;padding:54px 24px;color:var(--muted);
}
.empty-ic{
  width:56px;height:56px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;margin:0 auto 14px;color:var(--faint);
}
.empty h3{font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;max-width:300px;margin:0 auto;line-height:1.5}

.section-title{
  font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;
  margin:20px 4px 10px;
}

@media(min-width:700px){
  .modal{align-items:center;padding:20px}
  .modal-content{border-radius:var(--radius-lg);padding:22px 24px;max-height:85dvh}
  .handle{display:none}
  main{padding:22px}
  header{padding:16px 24px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo" id="loginLogo"></div>
    <h1>Mi Negocio Pro</h1>
    <p class="sub">Inicia sesión para gestionar tu inventario</p>
    <div class="field">
      <label for="emailInput">Correo electrónico</label>
      <input type="email" id="emailInput" class="input" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="passwordInput">Contraseña</label>
      <input type="password" id="passwordInput" class="input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn primary block" onclick="login()" style="margin-top:6px">Entrar</button>
    <div class="error" id="loginError">Credenciales incorrectas. Verifica tus datos.</div>
    <p class="login-foot"><span class="link" onclick="resetPassword()">¿Olvidaste tu contraseña?</span></p>
  </div>
</div>

<!-- ============ LOADER ============ -->
<div id="loader" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:999;place-items:center;">
  <div style="text-align:center">
    <div style="width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite"></div>
    <div style="font-size:13px;color:var(--muted)">Sincronizando…</div>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<!-- ============ APP ============ -->
<div id="mainApp" style="display:none">

  <header>
    <div class="header-row">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-info">
          <h1 id="brandName">Mi Negocio</h1>
          <span id="headerSub">Panel general</span>
        </div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="iconbtn" onclick="openSettings()" title="Ajustes" id="settingsBtn"></button>
        <button class="iconbtn" onclick="logout()" title="Cerrar sesión" id="logoutBtn"></button>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <span id="searchIcon"></span>
      <input type="text" id="searchInput" placeholder="Buscar modelo, IMEI o accesorio…" oninput="render()">
    </div>
    <div class="dash" id="dashGrid"></div>
  </header>

  <main>
    <div class="view active" id="view-phones"></div>
    <div class="view" id="view-acc"></div>
    <div class="view" id="view-wallet"></div>
    <div class="view" id="view-history"></div>
    <div class="view" id="view-settings"></div>
  </main>

  <button class="fab" id="fabBtn" onclick="handleFab()"></button>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="phones" onclick="switchTab('phones', event)"><span id="navIcons-phones"></span>Equipos</button>
    <button class="nav-item" data-tab="acc" onclick="switchTab('acc', event)"><span id="navIcons-acc"></span>Accesorios</button>
    <button class="nav-item" data-tab="wallet" onclick="switchTab('wallet', event)"><span id="navIcons-wallet"></span>Caja</button>
    <button class="nav-item" data-tab="history" onclick="switchTab('history', event)"><span id="navIcons-history"></span>Ventas</button>
    <button class="nav-item" data-tab="settings" onclick="switchTab('settings', event)"><span id="navIcons-settings"></span>Ajustes</button>
  </nav>
</div>

<!-- ============ MODAL ROOT ============ -->
<div class="modal" id="modalRoot"></div>

function icon(name, size = 20, sw = 1.9){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"

/* ============================================================
   ESTADO GLOBAL
============================================================ */
let phones = [], acc = [], hist = [], movs = [];
let wallet = { usd:0, cop:0, usdt:0, zinli:0, rate:4000 };
let settings = {
  businessName: 'Mi Negocio',
  theme: 'light',
  lowStock: 2,
  waTemplate: '🧾 *RECIBO*\n\n👤 Cliente: {cliente}\n📱 Producto: {producto}\n💰 Total: ${precio}\n📅 {fecha}\n\n✅ Garantía activa. ¡Gracias por tu compra!'
};
let userUID = null;
let currentTab = 'phones';
let searchQ = '';
let pendingSale = null;   // { type, id }
let undoStack = [];       // [{ label, snapshot, at }]

/* ============================================================
   UTILS
============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Date.now() + Math.random().toString(36).slice(2,7);
const fMoney = (n, sym = '$') => sym + (parseFloat(n)||0).toLocaleString('en-US', { maximumFractionDigits:2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleDateString('es', { day:'2-digit', month:'short', year:'numeric' });

function applyTheme(){
  document.documentElement.dataset.theme = settings.theme;
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', settings.theme === 'dark' ? '#000000' : '#F5F5F7');
}

/* ============================================================
   UNDO SYSTEM
============================================================ */
function snapshot(){
  return JSON.parse(JSON.stringify({ phones, acc, hist, movs, wallet }));
}
function pushUndo(label){
  undoStack.push({ label, snapshot: snapshot(), at: new Date().toISOString() });
  if (undoStack.length > 30) undoStack.shift();
}
async function undoLast(){
  const entry = undoStack.pop();
  if (!entry){ showToast('No hay cambios que deshacer'); return; }
  const s = entry.snapshot;
  phones = s.phones; acc = s.acc; hist = s.hist; movs = s.movs; wallet = s.wallet;
  await saveAll();
  showToast('Deshecho · ' + entry.label);
}

/* ============================================================
   TOAST
============================================================ */
let toastTimers = new WeakMap();
function showToast(msg, undoable = false){
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="msg">${esc(msg)}</span>` +
    (undoable ? `<button class="undo">${icon('undo',14,2.1)} Deshacer</button>` : '');
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));

  if (undoable){
    el.querySelector('.undo').onclick = async () => {
      closeToast(el);
      await undoLast();
    };
  }
  const t = setTimeout(() => closeToast(el), 6500);
  toastTimers.set(el, t);
}
function closeToast(el){
  clearTimeout(toastTimers.get(el));
  el.classList.remove('show');
  setTimeout(() => el.remove(), 250);
}

/* ============================================================
   AUTH
============================================================ */
onAuthStateChanged(auth, async user => {
  if (user){
    userUID = user.uid;
    $('#loginScreen').style.display = 'none';
    $('#mainApp').style.display = 'block';
    await loadData();
    bootUI();
  } else {
    userUID = null;
    $('#mainApp').style.display = 'none';
    $('#loginScreen').style.display = 'flex';
  }
});

window.login = () => {
  const email = $('#emailInput').value.trim();
  const pass  = $('#passwordInput').value;
  $('#loginError').classList.remove('show');
  signInWithEmailAndPassword(auth, email, pass)
    .catch(() => $('#loginError').classList.add('show'));
};
window.logout = () => signOut(auth);
window.resetPassword = () => {
  const e = prompt('Ingresa tu correo para recuperar contraseña:');
  if (!e) return;
  sendPasswordResetEmail(auth, e)
    .then(() => alert('Correo enviado. Revisa tu bandeja.'))
    .catch(() => alert('No se pudo enviar el correo.'));
};

/* ============================================================
   DATA
============================================================ */
async function loadData(){
  $('#loader').style.display = 'grid';
  try{
    const snap = await getDoc(doc(db, 'business_data', userUID));
    if (snap.exists()){
      const d = snap.data();
      phones   = d.phones   || [];
      acc      = d.acc      || [];
      hist     = d.hist     || [];
      movs     = d.movs     || [];
      wallet   = Object.assign({ usd:0, cop:0, usdt:0, zinli:0, rate:4000 }, d.wallet || {});
      settings = Object.assign(settings, d.settings || {});
    }
    applyTheme();
  } catch(e){
    console.error(e);
    alert('Error al cargar los datos.');
  }
  $('#loader').style.display = 'none';
}

async function saveAll(){
  $('#loader').style.display = 'grid';
  try{
    await setDoc(doc(db, 'business_data', userUID), {
      phones, acc, hist, movs, wallet, settings
    });
    render();
  } catch(e){
    console.error(e);
    alert('No se pudo guardar.');
  }
  $('#loader').style.display = 'none';
}

/* ============================================================
   BOOT UI
============================================================ */
function bootUI(){
  $('#loginLogo').innerHTML  = icon('smartphone', 28, 1.8);
  $('#brandMark').innerHTML  = icon('box', 18, 2);
  $('#settingsBtn').innerHTML= icon('settings', 18);
  $('#logoutBtn').innerHTML  = icon('logout', 18);
  $('#searchIcon').innerHTML = icon('search', 16, 2);
  $('#fabBtn').innerHTML     = icon('plus', 22, 2.4);

  // nav icons
  ['phones','acc','wallet','history','settings'].forEach(t => {
    const el = document.getElementById('navIcons-' + t);
    const ic = { phones:'phone', acc:'plug', wallet:'wallet', history:'chart', settings:'settings' }[t];
    if (el) el.innerHTML = icon(ic, 20, 1.9);
  });

  render();
}

/* ============================================================
   NAV
============================================================ */
window.switchTab = (tab, ev) => {
  currentTab = tab;
  searchQ = '';
  const si = $('#searchInput'); if (si) si.value = '';
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + tab));

  const showSearch = tab === 'phones' || tab === 'acc';
  $('#searchWrap').style.display = showSearch ? 'flex' : 'none';

  const fab = $('#fabBtn');
  fab.classList.toggle('hide', tab === 'history' || tab === 'settings');

  render();
};

/* ============================================================
   RENDER PRINCIPAL
============================================================ */
window.render = render;
function render(){
  searchQ = ($('#searchInput')?.value || '').toLowerCase().trim();
  $('#brandName').textContent = settings.businessName || 'Mi Negocio';

  if (currentTab === 'phones')  renderPhones();
  if (currentTab === 'acc')     renderAcc();
  if (currentTab === 'wallet')  renderWallet();
  if (currentTab === 'history') renderHistory();
  if (currentTab === 'settings')renderSettings();

  updateHeaderSub();
}

function updateHeaderSub(){
  const map = {
    phones: `${phones.length} equipos en inventario`,
    acc: `${acc.length} tipos de accesorios`,
    wallet: `Tasa: $1 = ${fMoney(wallet.rate, '$')} COP`,
    history: `${hist.length} ventas registradas`,
    settings: 'Preferencias de la aplicación'
  };
  $('#headerSub').textContent = map[currentTab] || '';
}

/* ============================================================
   VIEW · PHONES
============================================================ */
function renderPhones(){
  let cost = 0, price = 0;
  const items = phones.filter(p =>
    !searchQ ||
    (p.model || '').toLowerCase().includes(searchQ) ||
    (p.imei  || '').toLowerCase().includes(searchQ)
  );

  items.forEach(p => { cost += +p.cost || 0; price += +p.price || 0; });

  // Dashboard
  $('#dashGrid').innerHTML = `
    <div class="dash-card">
      <div class="lbl">${icon('box',11)} Inversión</div>
      <div class="val">${fMoney(cost)}</div>
    </div>
    <div class="dash-card">
      <div class="lbl">${icon('chart',11)} Proyectado</div>
      <div class="val acc">${fMoney(price)}</div>
    </div>
    <div class="dash-card">
      <div class="lbl">${icon('percentage',11)} Ganancia</div>
      <div class="val pos">+${fMoney(price - cost)}</div>
    </div>`;

  // List
  if (!items.length){
    $('#view-phones').innerHTML = emptyState('phone', 'Sin equipos',
      searchQ ? 'No se encontraron equipos con esa búsqueda.'
             : 'Presiona el botón + para agregar tu primer equipo.');
    return;
  }

  $('#view-phones').innerHTML = items.map(p => {
    const margin = (+p.price || 0) - (+p.cost || 0);
    const lowBat = (+p.bat || 100) < 80;
    return `
      <div class="card">
        <div class="row">
          <div class="thumb">${icon('phone', 20)}</div>
          <div class="info">
            <div class="title">${esc(p.model)}</div>
            <div class="sub">IMEI: ${esc(p.imei)}</div>
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
              <span class="badge ${lowBat?'warn':''}">${esc(p.bat)}% batería</span>
              <span class="badge neutral">${fmtDate(p.date)}</span>
            </div>
            <div class="meta-row">
              <span>Costo<b>${fMoney(p.cost)}</b></span>
              <span>Venta<b>${fMoney(p.price)}</b></span>
              <span>Margen<b class="${margin>=0?'pos':'neg'}">${margin>=0?'+':''}${fMoney(margin)}</b></span>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn green" onclick="prepSell('phone','${p.id}')">
            ${icon('tag',15)} Vender
          </button>
          <button class="btn ghost" onclick="editPhone('${p.id}')" title="Editar" style="flex:0 0 42px">
            ${icon('edit',15)}
          </button>
          <button class="btn ghost" onclick="confirmDelete('phone','${p.id}')" title="Eliminar" style="flex:0 0 42px">
            ${icon('trash',15)}
          </button>
        </div>
      </div>`;
  }).join('');
}

/* ============================================================
   VIEW · ACC
============================================================ */
function renderAcc(){
  let inv = 0;
  const items = acc.filter(a => !searchQ || a.name.toLowerCase().includes(searchQ));
  items.forEach(a => inv += (+a.cost || 0) * (+a.qty || 0));

  $('#dashGrid').innerHTML = `
    <div class="dash-card wide" style="background:var(--green-bg);border-color:transparent">
      <div class="lbl" style="color:var(--green)">${icon('coins',12)} Valor inventario accesorios</div>
      <div class="val pos" style="font-size:22px;margin-top:6px">${fMoney(inv)}</div>
    </div>`;

  if (!items.length){
    $('#view-acc').innerHTML = emptyState('plug', 'Sin accesorios',
      searchQ ? 'No se encontraron coincidencias.' : 'Presiona + para agregar accesorios.');
    return;
  }

  $('#view-acc').innerHTML = items.map(a => {
    const low = a.qty <= (settings.lowStock || 2);
    return `
      <div class="card ${low ? 'warn' : ''}">
        <div class="row">
          <div class="thumb">${icon('plug', 20)}</div>
          <div class="info">
            <div class="title">${esc(a.name)}</div>
            <div class="sub">Costo ${fMoney(a.cost)} · Venta ${fMoney(a.price)}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px">
              <div class="stock">
                <button onclick="modStock('${a.id}', -1)">${icon('x', 12, 2.5).replace('6','8').replace('18','16')}</button>
                <b>${a.qty}</b>
                <button onclick="modStock('${a.id}', 1)">${icon('plus', 12, 2.5)}</button>
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn green sm" onclick="prepSell('acc','${a.id}')">${icon('tag',13)} Vender</button>
                <button class="btn ghost sm" onclick="editAcc('${a.id}')" style="padding:0 10px">${icon('edit',13)}</button>
              </div>
            </div>
            ${low ? `<div style="margin-top:10px"><span class="badge warn">${icon('alert',11)} Stock bajo</span></div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ============================================================
   VIEW · WALLET
============================================================ */
function renderWallet(){
  const eqCop = wallet.rate ? (wallet.cop / wallet.rate) : 0;
  const total = wallet.usd + wallet.usdt + wallet.zinli + eqCop;
  const recent = movs.slice(-8).reverse();

  $('#dashGrid').innerHTML = `
    <div class="dash-card wide" style="background:var(--surface-2)">
      <div class="lbl" style="color:var(--accent)">${icon('wallet',12)} Total disponible (USD)</div>
      <div class="val acc" style="font-size:26px;margin-top:6px">${fMoney(total)}</div>
    </div>`;

  $('#view-wallet').innerHTML = `
    <div class="wallet-grid">
      <div class="wallet-card rate" onclick="updateRate()">
        <div class="cur">${icon('refresh',11)} Tasa COP/USD</div>
        <div class="amt" style="color:var(--amber)">${fMoney(wallet.rate, '$')}</div>
      </div>
      <div class="wallet-card">
        <div class="cur">${icon('coins',11)} Equivalente COP</div>
        <div class="amt">${fMoney(wallet.cop, '$')}</div>
      </div>
      <div class="wallet-card">
        <div class="cur">${icon('wallet',11)} Efectivo USD</div>
        <div class="amt">${fMoney(wallet.usd)}</div>
      </div>
      <div class="wallet-card">
        <div class="cur">${icon('coins',11)} USDT</div>
        <div class="amt">${fMoney(wallet.usdt)}</div>
      </div>
      <div class="wallet-card">
        <div class="cur">${icon('wallet',11)} Zinli</div>
        <div class="amt">${fMoney(wallet.zinli)}</div>
      </div>
    </div>

    <div class="section-title">Movimientos recientes</div>
    <div class="card" style="padding:6px 14px">
      ${recent.length ? recent.map(m => `
        <div class="h-item">
          <div class="left">
            <div class="l1">${esc(m.desc)}</div>
            <div class="l2">${fmtDate(m.date)} · ${esc(m.acc.toUpperCase())}</div>
          </div>
          <div class="right">
            <div class="amt ${m.type === 'gasto' ? 'neg' : 'pos'}">

    </div>
  `;

   VIEW · HISTORY
============================================================ */
function renderHistory(){
  let rev = 0, prof = 0;
  hist.forEach(h => { rev += (+h.sell || 0); prof += ((+h.sell || 0) - (+h.cost || 0)); });

  $('#dashGrid').innerHTML = `
    <div class="dash-card">
      <div class="lbl">${icon('chart',11)} Ingresos</div>
      <div class="val">${fMoney(rev)}</div>
    </div>
    <div class="dash-card" style="grid-column:span 2">
      <div class="lbl">${icon('percentage',11)} Ganancia total</div>
      <div class="val pos">+${fMoney(prof)}</div>
    </div>`;

  const list = hist.slice().reverse();

/* ============================================================

============================================================ */
function openModal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-content">
    <div class="handle"></div>
    ${html}
  </div>`;
  root.classList.add('show');
  document.body.style.overflow = 'hidden';
  root.onclick = e => { if (e.target === root) closeModal(); };
}
function closeModal(){
  $('#modalRoot').classList.remove('show');
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
window.closeModals = closeModal;

function modalHeader(title){
  return `<div class="modal-head">
    <h2>${esc(title)}</h2>
    <button class="iconbtn" onclick="closeModals()">${icon('x',18)}</button>
  </div>`;
}

function confirmDialog({ title, text, confirmLabel='Eliminar', onConfirm }){
  openModal(`
    <div class="confirm-box">
      <div class="confirm-ic">${icon('alert',24,2)}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(text)}</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModals()">Cancelar</button>
      <button class="btn danger" id="confirmOk">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#confirmOk').onclick = () => { closeModal(); onConfirm(); };
}

window.prepSell = (type, id) => {
  const item = type === 'phone' ? phones.find(x => x.id === id) : acc.find(x => x.id === id);
  if (!item) return;
  if (type === 'acc' && item.qty <= 0){ showToast('Sin stock disponible'); return; }
  pendingSale = { type, id };

  openModal(`
    ${modalHeader('Confirmar venta')}
    <div style="padding:12px;background:var(--surface-2);border-radius:10px;margin-bottom:16px">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600">Producto</div>
      <div style="font-size:15px;font-weight:600;margin-top:2px">${esc(item.model || item.name)}</div>
      ${type === 'phone' ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">IMEI: ${esc(item.imei)}</div>` : ''}
    </div>
    <form id="fSell" class="form-grid">
      <div class="field full">
        <label>Nombre del cliente</label>
        <input class="input" name="client" required placeholder="Juan Pérez" autofocus>
      </div>
      <div class="field full">
        <label>WhatsApp del cliente</label>
        <input class="input" name="phone" type="tel" required placeholder="58412…">
      </div>
      <div class="field">
        <label>Precio final (USD)</label>
        <input class="input" name="price" type="number" step="0.01" required value="${esc(item.price)}">
      </div>
      <div class="field">
        <label>Método de pago</label>
        <select class="input" name="account">
          <option value="usd">Efectivo USD</option>
          <option value="cop">Efectivo COP</option>
          <option value="usdt">USDT</option>
          <option value="zinli">Zinli</option>
        </select>
      </div>
      <div class="modal-foot full">
        <button type="button" class="btn ghost" onclick="closeModals()">Cancelar</button>
        <button type="submit" class="btn green">${icon('message',15)} Vender y enviar recibo</button>
      </div>
    </form>
  `);

  $('#fSell').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const client = fd.get('client');
    const phone  = fd.get('phone');
    const price  = +fd.get('price');
    const account = fd.get('account');

    // SNAPSHOT ANTES DE MUTAR
    pushUndo('Venta · ' + (item.model || item.name));

    let saleItemStr = '';
    if (type === 'phone'){
      hist.push({
        id: uid(), type:'phone', name: item.model, imei: item.imei,
        client, cost: item.cost, sell: price,
        account, date: new Date().toISOString()
      });
      saleItemStr = `📱 *${item.model}*\nIMEI: ${item.imei}`;
      phones = phones.filter(x => x.id !== item.id);
    } else {
      hist.push({
        id: uid(), type:'acc', name: item.name, imei:'N/A',
        client, cost: item.cost, sell: price,
        account, date: new Date().toISOString()
      });
      saleItemStr = `🔌 *${item.name}*`;
      item.qty -= 1;
    }

    // Sumar a caja
    if (account === 'cop') wallet.cop += price * wallet.rate;
    else wallet[account] += price;

    closeModal(); await saveAll();
    showToast('Venta registrada · ' + (item.model || item.name), true);

    // WhatsApp
    const msg = (settings.waTemplate || '')
      .replace(/{cliente}/g, client)
      .replace(/{producto}/g, saleItemStr)
      .replace(/{precio}/g, price.toFixed(2))
      .replace(/{fecha}/g, fmtDate(new Date()));
    window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
  };
};

/* ============================================================
   ACCIONES · STOCK / DELETE / UNDO
============================================================ */
window.modStock = async (id, delta) => {
  const a = acc.find(x => x.id === id);
  if (!a) return;
  if (a.qty + delta < 0) return;
  pushUndo('Stock · ' + a.name);
  a.qty += delta;
  await saveAll();
  // Silencioso: no toast por cada click
  if (undoStack.length > 30) undoStack.shift();
};

window.confirmDelete = (type, id) => {
  const item = type === 'phone' ? phones.find(x => x.id === id) : acc.find(x => x.id === id);
  if (!item) return;
  const name = item.model || item.name;
  confirmDialog({
    title: '¿Eliminar ' + name + '?',
    text: 'Podrás deshacerlo usando el botón "Deshacer" que aparecerá abajo.',
    confirmLabel: 'Sí, eliminar',
    onConfirm: async () => {
      pushUndo('Eliminar · ' + name);
      if (type === 'phone') phones = phones.filter(x => x.id !== id);
      else                  acc    = acc.filter(x => x.id !== id);
      await saveAll();
      showToast('Eliminado · ' + name, true);
    }
  });
};

window.undoSale = id => {
  const sale = hist.find(h => h.id === id);
  if (!sale) return;
  confirmDialog({
    title: '¿Anular esta venta?',
    text: 'El producto volverá al inventario y el dinero se restará de la caja.',
    confirmLabel: 'Anular venta',
    onConfirm: async () => {
      pushUndo('Anular venta · ' + sale.name);
      hist = hist.filter(h => h.id !== id);

      if (sale.type === 'phone'){
        phones.push({
          id: uid(), model: sale.name, imei: sale.imei,
          bat: 100, notes: 'Restaurado de venta anulada',
          cost: sale.cost, price: sale.sell,
          date: new Date().toISOString()
        });
      } else {
        const a = acc.find(x => x.name === sale.name);
        if (a) a.qty += 1;
      }

      if (sale.account === 'cop') wallet.cop -= sale.sell * wallet.rate;
      else if (sale.account) wallet[sale.account] -= sale.sell;

      await saveAll();
      showToast('Venta anulada · ' + sale.name, true);
    }
  });
};

window.undoMove = id => {
  const m = movs.find(x => x.id === id);
  if (!m) return;
  confirmDialog({
    title: '¿Eliminar este movimiento?',
    text: 'Se revertirá el cambio en la cuenta correspondiente.',
    confirmLabel: 'Sí, revertir',
    onConfirm: async () => {
      pushUndo('Revertir ' + (m.type === 'gasto' ? 'gasto' : 'ingreso') + ' · ' + m.desc);
      if (m.type === 'gasto') wallet[m.acc] += m.amt;
      else                    wallet[m.acc] -= m.amt;
      movs = movs.filter(x => x.id !== id);
      await saveAll();
      showToast('Movimiento revertido', true);
    }
  });
};

window.resendReceipt = id => {
  const h = hist.find(x => x.id === id);
  if (!h) return;
  const phone = prompt('Número de WhatsApp (con código de país):', '');
  if (!phone) return;
  const itemStr = h.type === 'phone'
    ? `📱 *${h.name}*\nIMEI: ${h.imei}`
    : `🔌 *${h.name}*`;
  const msg = (settings.waTemplate || '')
    .replace(/{cliente}/g, h.client || '')
    .replace(/{producto}/g, itemStr)
    .replace(/{precio}/g, (+h.sell).toFixed(2))
    .replace(/{fecha}/g, fmtDate(h.date));
  window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
};

  const name = prompt('Nombre del negocio:', settings.businessName);
  if (name && name.trim()){
    settings.businessName = name.trim();
    await saveAll();
    showToast('Nombre actualizado');
  }
};

window.editLowStock = async () => {
  const n = prompt('Avisar cuando el stock sea menor o igual a:', settings.lowStock);
  if (n && !isNaN(+n)){
    settings.lowStock = Math.max(1, parseInt(n));
    await saveAll();
    showToast('Alerta ajustada a ' + settings.lowStock);
  }
};

window.editWaTemplate = async () => {
  const t = prompt('Plantilla de WhatsApp. Variables: {cliente} {producto} {precio} {fecha}',
                   settings.waTemplate);
  if (t && t.trim()){
    settings.waTemplate = t;
    await saveAll();
    showToast('Plantilla actualizada');
  }
};

window.updateRate = async () => {
  const r = prompt('Tasa COP por 1 USD:', wallet.rate);
  if (r && +r > 0){
    wallet.rate = +r;
    await saveAll();
    showToast('Tasa actualizada');
  }
};

window.exportBackup = () => {
  const data = { phones, acc, hist, movs, wallet, settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respaldo-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Respaldo descargado');
};

window.importBackup = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      pushUndo('Restaurar respaldo');
      if (Array.isArray(data.phones)) phones = data.phones;
      if (Array.isArray(data.acc))    acc = data.acc;
      if (Array.isArray(data.hist))   hist = data.hist;
      if (Array.isArray(data.movs))   movs = data.movs;
      if (data.wallet)   wallet = Object.assign(wallet, data.wallet);
      if (data.settings) settings = Object.assign(settings, data.settings);
      applyTheme();
      await saveAll();
      showToast('Respaldo restaurado correctamente', true);
    } catch(err){
      alert('El archivo no es un respaldo válido.');
    }
  };
  input.click();
};

window.clearAllData = () => {
  confirmDialog({
    title: '¿Borrar TODOS los datos?',
    text: 'Se eliminarán equipos, accesorios, ventas, movimientos y saldos. Esta acción no se puede deshacer.',
    confirmLabel: 'Borrar todo',
    onConfirm: async () => {
      pushUndo('Borrar todos los datos');
      phones = []; acc = []; hist = []; movs = [];
      wallet = { usd:0, cop:0, usdt:0, zinli:0, rate: wallet.rate };
      await saveAll();
      showToast('Datos eliminados', true);
    }
  });
};

/* ============================================================
   CSV EXPORT
============================================================ */
window.exportToCSV = () => {
  let csv = 'Cliente,Producto,IMEI,Costo (USD),Venta (USD),Ganancia (USD),Cuenta,Fecha\n';
  hist.forEach(h => {
    const g = (+h.sell || 0) - (+h.cost || 0);
    csv += `"${(h.client||'').replace(/"/g,'""')}","${(h.name||'').replace(/"/g,'""')}","${h.imei||''}",${h.cost},${h.sell},${g},${h.account||''},"${fmtDate(h.date)}"\n`;
  });
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ventas-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Reporte CSV descargado');
};

/* ============================================================
   ATAJOS DE TECLADO
============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // Ctrl/Cmd + Z = deshacer
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){
    e.preventDefault();
    undoLast();
  }
  // "/" para buscar
  if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault();
    if (currentTab === 'phones' || currentTab === 'acc'){
      $('#searchInput')?.focus();
    }
  }
});
</script>
